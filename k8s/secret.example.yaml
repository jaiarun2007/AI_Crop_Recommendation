# Template only -- DO NOT commit real values. Copy to secret.yaml (gitignored),
# fill in real values, and `kubectl apply -f k8s/secret.yaml`.
#
# Generate JWT_SECRET_KEY with:
#   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
apiVersion: v1
kind: Secret
metadata:
  name: farming-assistant-secrets
  namespace: ai-crop-recommendation
type: Opaque
stringData:
  JWT_SECRET_KEY: "REPLACE_ME"
  # Optional -- enables real LLM synthesis in the AI assistant; omit to use
  # extractive-only mode.
  ANTHROPIC_API_KEY: ""
